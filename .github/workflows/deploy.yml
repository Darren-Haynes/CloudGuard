name: CloudGuard Full-Stack Telemetry Azure Serverless Deployment Pipeline

on:
  push:
    branches: [ main, feat/serverless-backend ]

jobs:
  validate-and-test:
    name: ⚙️ Full-Stack Quality Assurance Pass
    runs-on: ubuntu-latest
    steps:
    - name: Clone Repository Workspace Tree
      uses: actions/checkout@v4

    - name: Initialize .NET SDK Environment
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Initialize Node.js Lifecycle Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: src/CloudGuard.Client/package-lock.json

    - name: Execute Full Backend Validation Suite
      run: |
        dotnet restore
        dotnet test --configuration Release /p:CollectCoverage=true

    - name: Execute Client Linting and Compilation Matrix
      run: |
        cd src/CloudGuard.Client
        npm ci
        npx tsc --noEmit
        npm run test

  deploy-infrastructure:
    name: 🚀 Cloud Production Ship Event
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Clone Workspace Artifact Sources
      uses: actions/checkout@v4

    - name: Log in to Azure via Federated Credentials
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 🏢 AUTOMATED STORAGE AND RESOURCE RECTIFICATION WITH FLEX ENGINES
    - name: Provision Cheap Cloud Storage Vault and Database Container
      run: |
        az account set --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"

        echo "Ensuring target corporate resource group container exists..."
        az group create --name rg-cloudguard --location eastus2 --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"

        echo "Registering Microsoft.Storage resource namespace..."
        az provider register --namespace Microsoft.Storage --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"

        echo "Waiting for Azure control plane to propagate storage namespace registrations..."
        sleep 15

        az account set --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"

        echo "Building serverless storage account data vault..."
        az storage account create --name stcloudguarddata --resource-group rg-cloudguard --location eastus2 --sku Standard_LRS --allow-blob-public-access false --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"

        echo "Ensuring secure storage deployment container bucket exists..."
        CONNECTION_STRING=$(az storage account show-connection-string --name stcloudguarddata --resource-group rg-cloudguard --query connectionString --output tsv --subscription "8a924534-6e8e-4208-bb80-f63320da15bf")
        echo "::add-mask::$CONNECTION_STRING"
        az storage container create --name deployments --connection-string "$CONNECTION_STRING"

        # 🟢 PROVISION EXPLICIT FLEX CONSUMPTION APP SERVICE PLAN INFRASTRUCTURE STAMP
        echo "Provisioning dedicated serverless Flex Consumption service plan container..."
        az resource create \
          --resource-group rg-cloudguard \
          --resource-type "Microsoft.Web/serverfarms" \
          --name "plan-cloudguard-flex" \
          --is-full-object \
          --properties '{"location":"eastus2","sku":{"name":"FC1","tier":"FlexConsumption"},"properties":{"reserved":true}}' \
          --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"

        # 🚀 PROVISION PREMIER NATIVE FLEX CONSUMPTION APP PINNED TO EXPLICIT FLEX HARDWARE
        echo "Provisioning modern serverless Flex Consumption app container pinned to the Flex plan..."
        az functionapp create --name func-cloudguard-telemetry-api --resource-group rg-cloudguard --plan plan-cloudguard-flex --runtime dotnet-isolated --runtime-version 10 --storage-account stcloudguarddata --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"

    - name: Compile and Ship React Frontend Production Bundle
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: "src/CloudGuard.Client"
        output_location: "dist"

    # 🛰️ COMPILE AND PUBLISH .NET 10 ISOLATED FUNCTIONS BACKEND TO FLEX CONSUMPTION
    - name: Setup .NET Core SDK for Functions Compilation
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build and Publish Serverless Backend Package
      run: |
        cd src/CloudGuard.Functions
        dotnet publish --configuration Release --output ./publish_output

    - name: Deploy Backend Package via Native Azure CLI Core
      run: |
        az account set --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"

        echo "Creating raw deployment ZIP packet..."
        cd src/CloudGuard.Functions/publish_output
        zip -r ../../../../functions_deploy.zip .
        cd ../../../../

        echo "Injecting ZIP archive packet directly to the serverless Flex container gates..."
        az functionapp deployment source config-zip \
          --name func-cloudguard-telemetry-api \
          --resource-group rg-cloudguard \
          --src functions_deploy.zip \
          --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"
