name: CloudGuard Full-Stack Fleet Telemetry Azure Deployment Pipeline

on:
  push:
    branches: [ main, feat/serverless-telemetry ] # 🔥 Added your active feature branch so the pipeline triggers immediately on your push!

jobs:
  validate-and-test:
    name: ⚙️ Automated Quality Assurance and Contract Verification Pass
    runs-on: ubuntu-latest
    steps:
    - name: Clone Repository Workspace Tree
      uses: actions/checkout@v4

    - name: Initialize .NET SDK Environment
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Initialize Node.js Lifecycle Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: src/CloudGuard.Client/package-lock.json

    - name: Execute Full Backend Validation Suite
      run: |
        dotnet restore
        dotnet test --configuration Release /p:CollectCoverage=true

    - name: Execute Client Linting and Compilation Matrix
      run: |
        cd src/CloudGuard.Client
        npm ci
        npx tsc --noEmit
        npm run test

  deploy-infrastructure:
    name: 🚀 Cloud Production Ship Event (Azure Free Tier Synchronization)
    needs: validate-and-test # Enforces that cloud distribution only occurs if tests pass completely green!
    runs-on: ubuntu-latest
    steps:
    - name: Clone Workspace Artifact Sources
      uses: actions/checkout@v4

    - name: Log in to Azure via Federated Credentials
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Compile Optimized React Production Assets
      run: |
        cd src/CloudGuard.Client
        npm ci
        npm run build

    # 📥 SYNC AND DEPLOY REACT STATIC PRODUCTION BUNDLES TO AZURE CDN
    - name: Deploy Frontend to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: "src/CloudGuard.Client" # Location of your client application source code
        output_location: "dist" # The optimized folder containing your compiled HTML/JS/CSS assets

    # 🛰️ COMPILE AND PUBLISH .NET 10 ISOLATED FUNCTIONS BACKEND TO FLEX CONSUMPTION
    - name: Setup .NET Core SDK for Functions Compilation
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build and Publish Serverless Backend Package
      run: |
        cd src/CloudGuard.Functions
        dotnet publish --configuration Release --output ./publish_output

    - name: Deploy Backend Package via Native Azure CLI Core
      run: |
        az account set --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"

        echo "Creating raw deployment ZIP packet..."
        cd src/CloudGuard.Functions/publish_output
        zip -r ../../../../functions_deploy.zip .
        cd ../../../../

        echo "Injecting ZIP archive packet directly to the serverless Flex container gates..."
        az functionapp deployment source config-zip \
          --name func-cloudguard-telemetry-prd \
          --resource-group rg-cloudguard-prod \
          --src functions_deploy.zip \
          --subscription "8a924534-6e8e-4208-bb80-f63320da15bf"
