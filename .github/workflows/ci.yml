name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Pinned on purpose: GitHub starts moving the ubuntu-latest label to Ubuntu 26.04 on
    # 2026-10-19, and this pipeline has not run there. deploy.yml is pinned the same way.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CloudGuard.slnx

      - name: Build solution
        run: dotnet build CloudGuard.slnx --configuration Release --no-restore

      - name: Run tests with code coverage
        run: dotnet test CloudGuard.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
